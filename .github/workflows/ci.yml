name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast lane: structural QC, control verification, unit arithmetic. No torch, no
  # DeepPurpose, no checkpoint downloads -- finishes in well under a minute.
  fast:
    name: fast tests (no DL stack)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (no deep-learning stack)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy requests PyYAML "rdkit>=2023.3.1"
          python -m pip install pytest ruff
          python -m pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest tests/ -m "not needs_deeppurpose" -v

  # Full lane: adds torch + DeepPurpose and runs the end-to-end pipeline test with
  # random-weight models. Still downloads no checkpoints.
  full:
    name: full tests (with DeepPurpose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps DeepPurpose==0.1.5
          python -m pip install -r requirements.txt
          python -m pip install -e . ".[dev]"

      - name: Verify DeepPurpose imports
        run: python -c "from DeepPurpose import DTI; print('DeepPurpose import OK')"

      - name: Test
        run: pytest tests/ -v
